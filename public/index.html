<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Builder Hub</title>
  <link rel="icon" href="favicon.png" />
  <link rel="stylesheet" href="hub.css" />
</head>
<body>
  <!-- 헤더는 11 Christmas / 10 Trade In-Up 빌더의 app-header 와 같은 모양 -->
  <header class="app-header">
    <a class="brand" href="/" aria-label="Home">
      <img src="lg-logo.svg" alt="LG" />
      <span class="divider"></span>
      <span class="title">Builder Hub</span>
    </a>
  </header>

  <main class="hub">
    <div class="hub-head">
      <h1>Promotion Builder</h1>
      <p>Select a builder to start.</p>
    </div>
    <div class="hub-grid" id="grid"></div>
  </main>

  <script type="module">
    import { BUILDERS, PROMO_TYPES } from './builders.js';

    const arrow = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11L11 5M6 5h5v5"/></svg>';

    // Coming soon 카드는 <div> 라 눌러도 이동하지 않는다
    document.getElementById('grid').innerHTML = BUILDERS.map((b) => {
      const thumb = b.comingSoon
        ? '<span class="hub-card-thumb soon"><span class="hub-soon">Coming soon</span></span>'
        : `<span class="hub-card-thumb"><img src="${b.thumb}" alt="" loading="lazy" style="object-position: ${b.thumbPos ?? 'center'}" /></span>`;
      const body = `
        ${thumb}
        <span class="hub-card-text">
          <span class="hub-card-type type-${b.type}">${PROMO_TYPES[b.type]}</span>
          <span class="hub-card-name">${b.name}</span>
          <span class="hub-card-desc">${b.desc}</span>
        </span>
        ${b.comingSoon ? '' : `<span class="hub-card-arrow">${arrow}</span>`}`;
      return b.comingSoon
        ? `<div class="hub-card is-soon" aria-disabled="true">${body}</div>`
        : `<a class="hub-card" href="${b.url}" data-url="${b.url}">${body}</a>`;
    }).join('');
  </script>
  <script type="module" src="country.js"></script>
</body>
</html>
